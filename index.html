<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bloomwater AR RSI Fishing</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a0a2a; font-family: system-ui, sans-serif; touch-action: none; }
  canvas { display: block; cursor: crosshair; }
  #ui {
    position: absolute; top: 20px; left: 20px; color: #ffe0c0; pointer-events: none;
    text-shadow: 0 0 10px #ff8800;
  }
  #ui h1 { margin: 0 0 8px 0; font-size: 28px; letter-spacing: 2px; }
  #ui p { margin: 4px 0; font-size: 14px; opacity: 0.9; }
  #rsi {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    width: 320px; height: 70px; background: rgba(0,0,0,0.5); border-radius: 10px;
    border: 1px solid #ff8800; padding: 8px; color: #fff; text-align: center;
    pointer-events: none;
  }
  #rsi .bar { height: 12px; background: #331; border-radius: 6px; margin-top: 6px; overflow: hidden; }
  #rsi .fill { height: 100%; width: 50%; background: linear-gradient(90deg, #ff8800, #ff00aa); transition: width 0.1s; }
  #castBtn {
    position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
    padding: 14px 32px; font-size: 18px; background: #ff6600; color: white; border: none;
    border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px #ff8800; pointer-events: auto;
  }
  video { display: none; }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="ui">
  <h1>BLOOMWATER AR</h1>
  <p>Tap anywhere or press the button to cast • Hold Space to reel</p>
  <p id="status">Allow camera for the world around you…</p>
  <p id="score">Caught: 0</p>
</div>
<button id="castBtn">CAST LINE</button>
<div id="rsi">
  <div>RESONANCE STRENGTH INDEX</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div id="rsiVal">50.0</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const video = document.getElementById('cam');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

const particles = [];
const fish = [];
const planets = [];
let bobber = null;
let line = null;
let reeling = false;
let score = 0;
let rsiHistory = [];
let currentRSI = 50;
let cameraReady = false;

// Request camera for AR overlay
navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
  .then(stream => {
    video.srcObject = stream;
    cameraReady = true;
    document.getElementById('status').textContent = 'Camera live — fish swim around you';
  })
  .catch(() => {
    document.getElementById('status').textContent = 'Camera blocked — sunset mode only';
  });

// Planets for the sky
for (let i = 0; i < 6; i++) {
  planets.push({
    x: Math.random() * W,
    y: Math.random() * H * 0.35,
    r: 8 + Math.random() * 18,
    hue: 20 + Math.random() * 40,
    speed: 0.2 + Math.random() * 0.4,
    phase: Math.random() * Math.PI * 2
  });
}

class Particle {
  constructor(x, y, vx, vy, life, size, color) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.size = size; this.color = color;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.1; this.vx *= 0.99;
    this.life--;
  }
  draw() {
    const a = this.life / this.maxLife;
    ctx.globalAlpha = a * 0.85;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * a, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 25 * a;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

function bloom(x, y, count = 50, power = 1) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (3 + Math.random() * 7) * power;
    particles.push(new Particle(
      x, y,
      Math.cos(a) * s, Math.sin(a) * s - 2,
      45 + Math.random() * 35,
      4 + Math.random() * 6,
      `hsl(${30 + Math.random() * 50}, 100%, ${60 + Math.random() * 25}%)`
    ));
  }
}

class Fish {
  constructor() {
    this.x = Math.random() * W;
    this.y = H * 0.55 + Math.random() * H * 0.35;
    this.vx = (Math.random() - 0.5) * 1.8;
    this.size = 14 + Math.random() * 22;
    this.hue = 190 + Math.random() * 80;
    this.phase = Math.random() * Math.PI * 2;
  }
  update() {
    this.x += this.vx;
    this.y += Math.sin(this.phase + Date.now() / 350) * 0.5;
    this.phase += 0.06;
    if (this.x < -60 || this.x > W + 60) this.vx *= -1;
    if (bobber && !bobber.hooked && Math.hypot(this.x - bobber.x, this.y - bobber.y) < 45 && Math.random() < 0.01) {
      bobber.hooked = this;
      document.getElementById('status').textContent = 'BITE! Hold Space to reel';
      bloom(bobber.x, bobber.y, 70, 1.6);
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.vx > 0 ? 1 : -1, 1);
    ctx.fillStyle = `hsl(${this.hue}, 85%, 60%)`;
    ctx.shadowBlur = 18;
    ctx.shadowColor = `hsl(${this.hue}, 100%, 75%)`;
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-this.size * 0.8, 0);
    ctx.lineTo(-this.size * 1.5, -this.size * 0.45);
    ctx.lineTo(-this.size * 1.5, this.size * 0.45);
    ctx.fill();
    ctx.restore();
  }
}

function calcRSI(values, period = 14) {
  if (values.length < period + 1) return 50;
  let gains = 0, losses = 0;
  for (let i = values.length - period; i < values.length; i++) {
    const diff = values[i] - values[i - 1];
    if (diff > 0) gains += diff; else losses -= diff;
  }
  const avgGain = gains / period;
  const avgLoss = losses / period || 0.0001;
  const rs = avgGain / avgLoss;
  return 100 - (100 / (1 + rs));
}

function cast(x, y) {
  if (line) return;
  const startY = H * 0.38;
  line = { x1: W / 2, y1: startY, x2: x, y2: Math.max(H * 0.5, y), progress: 0 };
  bobber = { x, y: line.x2 ? line.y2 : y, hooked: null, tension: 0 };
  rsiHistory = [];
  document.getElementById('status').textContent = 'Line flying… waiting for the bloom';
  bloom(x, y, 90, 2.2);
}

function updateRSI() {
  if (!bobber || !bobber.hooked || !reeling) return;
  const pull = Math.sin(Date.now() / 180) * bobber.hooked.size * 0.35 + (Math.random() - 0.5) * 5;
  rsiHistory.push(pull);
  if (rsiHistory.length > 28) rsiHistory.shift();
  currentRSI = calcRSI(rsiHistory);
  document.getElementById('fill').style.width = currentRSI + '%';
  document.getElementById('rsiVal').textContent = currentRSI.toFixed(1);
  bobber.tension += (currentRSI > 72 || currentRSI < 28) ? 0.9 : -0.25;
  bobber.tension = Math.max(0, Math.min(100, bobber.tension));
  if (bobber.tension > 94) {
    document.getElementById('status').textContent = 'Line snapped — resonance broke';
    bloom(bobber.x, bobber.y, 40);
    bobber = null; line = null; reeling = false;
  }
}

function reelSuccess() {
  score++;
  document.getElementById('score').textContent = 'Caught: ' + score;
  document.getElementById('status').textContent = 'Landed! The sky celebrates.';
  bloom(bobber.x, bobber.y, 120, 2.8);
  bobber = null; line = null; reeling = false;
}

function drawSunsetAndPlanets() {
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  sky.addColorStop(0, '#1a0530');
  sky.addColorStop(0.3, '#ff6b35');
  sky.addColorStop(0.55, '#ff9f43');
  sky.addColorStop(0.7, '#ffd93d');
  sky.addColorStop(1, '#2a1a40');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.5);

  planets.forEach(p => {
    p.x += Math.sin(p.phase + Date.now() / 2000) * p.speed;
    p.phase += 0.01;
    if (p.x < -30) p.x = W + 30;
    if (p.x > W + 30) p.x = -30;
    ctx.fillStyle = `hsl(${p.hue}, 70%, 65%)`;
    ctx.shadowBlur = 15;
    ctx.shadowColor = `hsl(${p.hue}, 100%, 70%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

function loop() {
  if (cameraReady && video.readyState >= 2) {
    ctx.drawImage(video, 0, 0, W, H);
    ctx.fillStyle = 'rgba(20, 10, 40, 0.35)';
    ctx.fillRect(0, 0, W, H);
  } else {
    drawSunsetAndPlanets();
  }

  ctx.strokeStyle = 'rgba(255, 200, 100, 0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 3) {
    const y = H * 0.48 + Math.sin(x * 0.012 + Date.now() / 700) * 9 + Math.sin(x * 0.025 + Date.now() / 450) * 5;
    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  ctx.fillStyle = 'rgba(10, 40, 80, 0.45)';
  ctx.fillRect(0, H * 0.48, W, H);

  if (fish.length < 14) fish.push(new Fish());
  fish.forEach(f => { f.update(); f.draw(); });

  if (line) {
    line.progress = Math.min(1, line.progress + 0.035);
    const lx = line.x1 + (line.x2 - line.x1) * line.progress;
    const ly = line.y1 + (line.y2 - line.y1) * line.progress;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(line.x1, line.y1);
    ctx.lineTo(lx, ly);
    ctx.stroke();
    if (line.progress >= 1 && bobber) {
      bobber.x = line.x2;
      bobber.y = line.y2;
      ctx.fillStyle = '#ff3366';
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#ff3366';
      ctx.beginPath();
      ctx.arc(bobber.x, bobber.y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      if (bobber.hooked && reeling) {
        bobber.hooked.y -= 1.3;
        bobber.y -= 0.9;
        if (bobber.y < H * 0.45) reelSuccess();
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  updateRSI();

  if (bobber && bobber.tension > 70) {
    ctx.fillStyle = `rgba(255, 60, 80, ${(bobber.tension - 70) / 35})`;
    ctx.fillRect(0, 0, W, H);
  }

  requestAnimationFrame(loop);
}

function handleCast(e) {
  e.preventDefault();
  e.stopPropagation();
  const rect = canvas.getBoundingClientRect();
  const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  if (!line && y > H * 0.42 && y < H * 0.95) cast(x, y);
}

canvas.addEventListener('pointerdown', handleCast, { passive: false });
canvas.addEventListener('click', handleCast);
canvas.addEventListener('touchstart', handleCast, { passive: false });
canvas.addEventListener('touchend', e => e.preventDefault(), { passive: false });
document.getElementById('castBtn').addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (!line) cast(W * 0.5 + (Math.random() - 0.5) * 180, H * 0.62);
});

addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); reeling = true; } });
addEventListener('keyup', e => { if (e.code === 'Space') reeling = false; });

setInterval(() => {
  if (Math.random() < 0.25) bloom(Math.random() * W, H * 0.48 + Math.random() * 15, 6, 0.3);
}, 700);

loop();
</script>
</body>
</html>
